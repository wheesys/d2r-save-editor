name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # CI 上没有游戏数据：只产出"可启动但无内置数据"的 exe。
  # 带数据的 exe 由维护者在本机用 tools/package.ps1 打包（数据不进仓库）。
  D2R_ALLOW_NO_BUNDLE: "1"

jobs:
  build-windows:
    name: Windows x64 exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> desktop/src-tauri/target"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建前端
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 构建桌面端（release）
        working-directory: desktop/src-tauri
        run: cargo build --release

      - name: 收集产物
        shell: pwsh
        run: |
          # 版本号取自桌面端 crate 的 manifest。注意 `desktop/src-tauri/Cargo.toml`
          # 用的是 `version.workspace = true`（继承根 workspace 版本），
          # 直接在这里 `Select-String '^version'` 是取不到的——所以从根
          # Cargo.toml 的 `[workspace.package]` 里读。
          $root = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') -Raw
          if ($root -notmatch '(?s)\[workspace\.package\].*?version\s*=\s*"([^"]+)"') {
            Write-Error '没能从根 Cargo.toml 的 [workspace.package] 里读到版本号'
            exit 1
          }
          $version = $Matches[1]
          $out = "dist/D2RSaveEditor-$version-win-x64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item desktop/src-tauri/target/release/d2r-desktop.exe $out
          # 供后续步骤（Release）使用
          "EXE_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $out | Format-List Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # **若该 tag 的 Release 已存在，就不要再传 exe**。
          #
          # 原因：维护者本机打包的 exe 与 CI 产物的**文件名完全相同**
          # （都是 D2RSaveEditor-<版本>-win-x64.exe），而 CI 产物不含内置游戏数据。
          # 这里若照常上传，会把带完整数据的版本覆盖成"名字退化成代码"的空壳。
          # 维护者本机打包并发布 release 之后再推 tag 属于正常流程，
          # 所以这里只是跳过上传，不算失败。
          $existing = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release $tag 已存在，跳过上传（避免覆盖本机打包的带数据版本）。"
            exit 0
          }
          gh release create $tag `
            --title "D2R 存档修改器 $tag" `
            --notes @'
          本构建来自公开 CI，**不含内置游戏数据**（仓库不存放数据）：
          解压后可以直接启动、可以打开存档并浏览，但物品名/技能名等会退化成代码，
          容器尺寸等需要在内置数据齐全时才精确。

          带完整内置数据的版本由维护者在本机打包分发，见 README 的相关说明。
          '@ `
            $env:EXE_PATH

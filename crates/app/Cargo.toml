[package]
name = "d2r-app"
description = "D2R 存档编辑器服务层：CLI 与 Tauri 界面共用（数据 + 编辑 + 校验）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["bundled-data"]
# 关闭后不内嵌数据包（体积更小，但要求用户机器上能找到游戏数据）
bundled-data = []

[dependencies]
d2r-core = { workspace = true }
d2r-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
include_dir = "0.7"

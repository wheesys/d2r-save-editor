[package]
name = "d2r-app"
description = "D2R 存档编辑器服务层：CLI 与 Tauri 界面共用（数据 + 编辑 + 校验）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["bundled-data"]
# 关闭后不内嵌数据包（体积更小，但要求运行环境里存在本地数据）
bundled-data = []

[dependencies]
# 用于读取属性编码信息（Save Bits / Save Add / ValShift）做值校验
d2s = "0.1.0"
d2r-core = { workspace = true }
d2r-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 运行时解压内嵌数据（构建期用 flate2 压缩，见 build.rs）
flate2 = "1"

[build-dependencies]
# 构建期压缩数据包（文本数据压到约 18%）
flate2 = "1"

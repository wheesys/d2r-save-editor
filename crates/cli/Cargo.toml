[package]
name = "d2r-cli"
description = "D2R 存档编辑器命令行工具：往返校验、存档检查、数据集检查"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "d2r"
path = "src/main.rs"

[dependencies]
d2r-core = { workspace = true }
d2r-data = { workspace = true }
d2r-app = { workspace = true }
serde_json = { workspace = true }
# quest-probe 要直接看任务段的原始位（core 只做解读后的接口）
d2s = "0.1.0"

[[bin]]
name = "layout-probe"
path = "src/bin/layout_probe.rs"
[[bin]]
name = "grid-probe"
path = "src/bin/grid_probe.rs"
[[bin]]
name = "quest-probe"
path = "src/bin/quest_probe.rs"

[[bin]]
name = "write-diag"
path = "src/bin/write_diag.rs"

[[bin]]
name = "config-diag"
path = "src/bin/config_diag.rs"

[[bin]]
name = "fieldcheck"
path = "src/bin/fieldcheck.rs"
